<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Customer Intelligence Map · Consignet</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0d1117;--bg2:#161b22;--bg3:#1c2333;--bg4:#21262d;
  --border:rgba(240,246,252,0.1);--border2:rgba(240,246,252,0.2);
  --text:#e6edf3;--text2:#8b949e;--text3:#484f58;--accent:#58a6ff;
}
html,body{height:100%;font-family:'Inter',sans-serif;background:var(--bg);color:var(--text);overflow:hidden}
.app{display:grid;grid-template-columns:300px 1fr;grid-template-rows:52px 1fr;height:100vh}
.topbar{grid-column:1/-1;display:flex;align-items:center;justify-content:space-between;padding:0 20px;background:var(--bg2);border-bottom:1px solid var(--border);z-index:1000}
.logo{display:flex;align-items:center;gap:10px}
.logo-pulse{width:8px;height:8px;border-radius:50%;background:var(--accent);animation:pulse 2s infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(88,166,255,.4)}50%{box-shadow:0 0 0 6px rgba(88,166,255,0)}}
.logo-name{font-size:13px;font-weight:600;letter-spacing:.05em;color:var(--text)}
.logo-name span{color:var(--text2);font-weight:400}
.topbar-right{display:flex;align-items:center;gap:10px}
.q-badge{font-family:'JetBrains Mono',monospace;font-size:11px;padding:3px 10px;background:rgba(88,166,255,.1);border:1px solid rgba(88,166,255,.25);border-radius:20px;color:var(--accent)}
.view-tabs{display:flex;background:var(--bg3);border:1px solid var(--border);border-radius:8px;overflow:hidden}
.view-tab{padding:5px 14px;font-size:12px;font-weight:500;border:none;cursor:pointer;background:transparent;color:var(--text2);transition:.15s}
.view-tab.active{background:var(--accent);color:#fff}
.import-btn{display:flex;align-items:center;gap:6px;padding:6px 14px;background:#238636;border:1px solid #2ea043;border-radius:6px;color:#fff;font-size:12px;font-weight:500;cursor:pointer}
.import-btn:hover{background:#2ea043}
#file-input{display:none}
.sidebar{background:var(--bg2);border-right:1px solid var(--border);overflow-y:auto;padding:16px 14px;display:flex;flex-direction:column;gap:16px}
.sidebar::-webkit-scrollbar{width:4px}
.sidebar::-webkit-scrollbar-thumb{background:var(--border2);border-radius:4px}
.sec-label{font-size:10px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--text3);margin-bottom:8px}
.metrics-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.metric{background:var(--bg3);border:1px solid var(--border);border-radius:8px;padding:10px 12px}
.metric-val{font-size:18px;font-weight:700;line-height:1;margin-bottom:3px}
.metric-lbl{font-size:10px;color:var(--text2)}
.thermo{display:flex;flex-direction:column;gap:5px}
.thermo-row{display:flex;align-items:center;gap:8px;cursor:pointer;padding:3px 6px;border-radius:6px;transition:.12s}
.thermo-row:hover{background:var(--bg4)}
.thermo-row.active-filter{background:rgba(88,166,255,.1);outline:1px solid rgba(88,166,255,.3)}
.thermo-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0}
.thermo-label{font-size:12px;color:var(--text2);flex:1}
.thermo-count{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--text2);min-width:28px;text-align:right}
.thermo-bar-bg{flex:2;height:4px;background:var(--bg4);border-radius:99px;overflow:hidden}
.thermo-bar{height:100%;border-radius:99px;transition:width .6s cubic-bezier(.16,1,.3,1)}
.filter-row{display:flex;flex-direction:column;gap:4px}
.filter-lbl{font-size:10px;color:var(--text3)}
select,input[type=text]{background:var(--bg3);border:1px solid var(--border);border-radius:6px;color:var(--text);font-family:'Inter',sans-serif;font-size:12px;padding:6px 9px;outline:none;width:100%;transition:.15s;-webkit-appearance:none}
select:focus,input:focus{border-color:var(--accent)}
.client-list{display:flex;flex-direction:column;gap:2px;max-height:260px;overflow-y:auto}
.client-list::-webkit-scrollbar{width:3px}
.client-list::-webkit-scrollbar-thumb{background:var(--border2)}
.cli{display:flex;align-items:center;gap:8px;padding:7px 8px;border-radius:6px;cursor:pointer;border:1px solid transparent;transition:.12s}
.cli:hover{background:var(--bg3)}
.cli.sel{background:rgba(88,166,255,.08);border-color:rgba(88,166,255,.3)}
.cli-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.cli-info{flex:1;min-width:0}
.cli-name{font-size:11px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cli-sub{font-size:10px;color:var(--text3)}
.cli-pct{font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--text2);flex-shrink:0}
.map-wrap{position:relative;background:var(--bg)}
#map{width:100%;height:100%}
.leaflet-tile-pane{filter:brightness(.35) saturate(.4) hue-rotate(180deg)}
.leaflet-container{background:#0d1117!important}
.leaflet-popup-content-wrapper{background:var(--bg2)!important;border:1px solid var(--border2)!important;border-radius:10px!important;box-shadow:0 8px 32px rgba(0,0,0,.6)!important;color:var(--text)!important;font-family:'Inter',sans-serif!important;padding:0!important}
.leaflet-popup-tip{background:var(--bg2)!important}
.leaflet-popup-content{margin:0!important;padding:12px 16px!important}
.pop-name{font-size:13px;font-weight:600;margin-bottom:8px}
.pop-row{display:flex;justify-content:space-between;gap:16px;font-size:11px;margin-bottom:3px}
.pop-key{color:var(--text2)}
.pop-val{font-weight:500}
.pop-badge{display:inline-block;padding:2px 8px;border-radius:99px;font-size:10px;font-weight:600;margin-top:6px}
.map-legend{position:absolute;bottom:24px;right:12px;z-index:500;background:rgba(13,17,23,.9);backdrop-filter:blur(8px);border:1px solid var(--border2);border-radius:8px;padding:10px 14px;min-width:160px}
.legend-title{font-size:9px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--text3);margin-bottom:8px}
.legend-row{display:flex;align-items:center;gap:8px;font-size:11px;color:var(--text2);margin-bottom:5px}
.legend-row:last-child{margin-bottom:0}
.legend-swatch{width:24px;height:6px;border-radius:99px;flex-shrink:0}
.map-stat{position:absolute;top:12px;left:12px;z-index:500;background:rgba(13,17,23,.85);backdrop-filter:blur(8px);border:1px solid var(--border);border-radius:8px;padding:8px 14px;font-size:12px;color:var(--text2)}
.map-stat strong{color:var(--text);font-weight:600}
</style>
</head>
<body>
<div class="app">
<header class="topbar">
  <div class="logo">
    <div class="logo-pulse"></div>
    <div class="logo-name">Customer Intelligence Map <span>· Consignet</span></div>
  </div>
  <div class="topbar-right">
    <span class="q-badge">Maio 2026</span>
    <div class="view-tabs">
      <button class="view-tab active" id="tab-all" onclick="setView('all')">Todos os clientes</button>
      <button class="view-tab" id="tab-heat" onclick="setView('heat')">Termômetro</button>
    </div>
    <button class="import-btn" onclick="document.getElementById('file-input').click()">
      <svg width="13" height="13" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M8 2v8M4 6l4-4 4 4M2 12h12"/></svg>
      Importar planilha
    </button>
    <input type="file" id="file-input" accept=".csv,.xlsx,.xls" onchange="handleFile(event)">
  </div>
</header>
<aside class="sidebar">
  <div>
    <div class="sec-label">Totais do produto</div>
    <div class="metrics-grid">
      <div class="metric"><div class="metric-val" id="m-clientes">1.518</div><div class="metric-lbl">Clientes ativos</div></div>
      <div class="metric"><div class="metric-val" id="m-estados">23</div><div class="metric-lbl">Estados</div></div>
      <div class="metric" style="grid-column:1/-1"><div class="metric-val" id="m-cpfs" style="color:#58a6ff">1.175.591</div><div class="metric-lbl">Total CPFs</div></div>
      <div class="metric"><div class="metric-val" id="m-cads" style="color:#c3e88d">108.327</div><div class="metric-lbl">QT Cadastros</div></div>
      <div class="metric"><div class="metric-val" id="m-users" style="color:#4ade80">96.213</div><div class="metric-lbl">QT Usuários ativos</div></div>
    </div>
  </div>
  <div>
    <div class="sec-label">Termômetro <span style="color:var(--text3);font-size:9px">(clique para filtrar)</span></div>
    <div class="thermo" id="thermo"></div>
  </div>
  <div>
    <div class="sec-label">Filtros</div>
    <div style="display:flex;flex-direction:column;gap:8px">
      <div class="filter-row"><span class="filter-lbl">Estado (UF)</span><select id="f-uf" onchange="applyFilters()"></select></div>
      <div class="filter-row"><span class="filter-lbl">Buscar</span><input type="text" id="f-search" placeholder="Nome da instituição..." oninput="applyFilters()"></div>
    </div>
  </div>
  <div style="flex:1;min-height:0">
    <div class="sec-label">Clientes <span id="list-count" style="color:var(--text3);font-size:9px"></span></div>
    <div class="client-list" id="client-list"></div>
  </div>
</aside>
<div class="map-wrap">
  <div id="map"></div>
  <div class="map-stat"><strong id="stat-showing">1.518</strong> visíveis · <span id="stat-uf">23 estados</span></div>
  <div class="map-legend" id="map-legend"></div>
</div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

const NIVEL_COLOR={'Excelente':'#00d26a','Muito Bom':'#4ade80','Bom':'#86efac','Regular':'#fbbf24','Baixo':'#fb923c','Muito Baixo':'#f87171','Crítico':'#ef4444','Sem dados':'#484f58','Sem Cadastros':'#6366f1'};
const NIVEL_ORDER=['Excelente','Muito Bom','Bom','Regular','Baixo','Muito Baixo','Crítico','Sem Cadastros','Sem dados'];
let allData=RAW,filtered=[...RAW],activeNivel=null,selectedIdx=-1,markers=[],markerLayer=null,currentView='all';

const map=L.map('map',{center:[-15.5,-54.0],zoom:4,zoomControl:true,attributionControl:false});
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:18}).addTo(map);

function makeIcon(color,size=9){return L.divIcon({className:'',html:`<div style="width:${size}px;height:${size}px;border-radius:50%;background:${color};border:2px solid rgba(255,255,255,.5);box-shadow:0 0 6px ${color}88"></div>`,iconSize:[size,size],iconAnchor:[size/2,size/2]})}
function makeHeatIcon(color,cpfs){const r=Math.max(12,Math.min(32,10+Math.sqrt(cpfs||0)*0.04));return L.divIcon({className:'',html:`<div style="width:${r*2}px;height:${r*2}px;border-radius:50%;background:${color}44;border:2.5px solid ${color};box-shadow:0 0 14px ${color}55;display:flex;align-items:center;justify-content:center"><div style="width:${r*0.55}px;height:${r*0.55}px;border-radius:50%;background:${color}"></div></div>`,iconSize:[r*2,r*2],iconAnchor:[r,r]})}

function fmtNum(n){if(n>=1000000) return (n/1000000).toFixed(1).replace('.',',')+'M';if(n>=1000) return Math.round(n/1000)+'K';return n.toLocaleString('pt-BR')}
function fmtFull(n){return n.toLocaleString('pt-BR')}

function popupHtml(d){const col=NIVEL_COLOR[d.nivel]||'#484f58';return`<div class="pop-name">${d.inst}</div><div class="pop-row"><span class="pop-key">UF</span><span class="pop-val">${d.uf}</span></div><div class="pop-row"><span class="pop-key">Qt CPFs</span><span class="pop-val">${fmtFull(d.cpfs)}</span></div><div class="pop-row"><span class="pop-key">Cadastros</span><span class="pop-val">${fmtFull(d.cads)}</span></div><div class="pop-row"><span class="pop-key">Usuários ativos</span><span class="pop-val">${fmtFull(d.users)}</span></div><div class="pop-row"><span class="pop-key">% Engajamento</span><span class="pop-val">${d.pct.toFixed(1).replace('.',',')}%</span></div><span class="pop-badge" style="background:${col}22;color:${col}">${d.nivel}</span>`}

function renderMarkers(){
  if(markerLayer) markerLayer.clearLayers();
  markerLayer=L.layerGroup().addTo(map);markers=[];
  filtered.forEach((d,i)=>{
    const col=NIVEL_COLOR[d.nivel]||'#484f58';
    const icon=currentView==='heat'?makeHeatIcon(col,d.cpfs):makeIcon(col,9);
    const m=L.marker([d.lat,d.lng],{icon}).bindPopup(popupHtml(d),{maxWidth:260}).on('click',()=>selectClient(i));
    markerLayer.addLayer(m);markers.push(m);
  });
}

function renderThermo(){
  const counts={};NIVEL_ORDER.forEach(n=>counts[n]=0);
  filtered.forEach(d=>{if(counts[d.nivel]!==undefined) counts[d.nivel]++});
  const max=Math.max(...Object.values(counts),1);
  document.getElementById('thermo').innerHTML=NIVEL_ORDER.map(n=>{
    if(!counts[n]) return '';
    const col=NIVEL_COLOR[n];const isA=activeNivel===n;
    return`<div class="thermo-row${isA?' active-filter':''}" onclick="toggleNivel('${n}')"><div class="thermo-dot" style="background:${col}"></div><span class="thermo-label">${n}</span><div class="thermo-bar-bg"><div class="thermo-bar" style="width:${counts[n]/max*100}%;background:${col}"></div></div><span class="thermo-count">${counts[n]}</span></div>`;
  }).join('');
}

function renderLegend(){
  const leg=document.getElementById('map-legend');
  const items=currentView==='heat'?NIVEL_ORDER.filter(n=>n!=='Sem dados'&&n!=='Sem Cadastros'):[];
  if(currentView==='heat'){leg.innerHTML=`<div class="legend-title">Nível de engajamento</div>`+items.map(n=>`<div class="legend-row"><div class="legend-swatch" style="background:${NIVEL_COLOR[n]}"></div><span>${n}</span></div>`).join('');}
  else{leg.innerHTML=`<div class="legend-title">Clientes ativos</div><div class="legend-row"><div class="legend-swatch" style="background:#58a6ff"></div><span>Localização</span></div>`;}
}

function renderList(){
  const list=document.getElementById('client-list');
  list.innerHTML=filtered.slice(0,80).map((d,i)=>{
    const col=NIVEL_COLOR[d.nivel]||'#484f58';
    return`<div class="cli${selectedIdx===i?' sel':''}" onclick="selectClient(${i})"><div class="cli-dot" style="background:${col}"></div><div class="cli-info"><div class="cli-name">${d.inst}</div><div class="cli-sub">${d.uf}${d.cidade?' · '+d.cidade:''}</div></div><span class="cli-pct">${d.pct>0?d.pct.toFixed(1).replace('.',',')+'%':'—'}</span></div>`;
  }).join('');
  document.getElementById('list-count').textContent=`(${filtered.length}${filtered.length>80?' · top 80':''})`;
}

function selectClient(i){selectedIdx=i;const d=filtered[i];map.setView([d.lat,d.lng],7,{animate:true});markers[i]?.openPopup();renderList()}

function updateStats(){
  document.getElementById('m-clientes').textContent=filtered.length.toLocaleString('pt-BR');
  const ufs=new Set(filtered.map(d=>d.uf));
  document.getElementById('m-estados').textContent=ufs.size;
  document.getElementById('stat-showing').textContent=filtered.length.toLocaleString('pt-BR');
  document.getElementById('stat-uf').textContent=ufs.size+' estados';
}

function toggleNivel(n){activeNivel=activeNivel===n?null:n;applyFilters()}

function populateUF(){
  const sel=document.getElementById('f-uf');const cur=sel.value;
  sel.innerHTML='<option value="">Todos os estados</option>';
  [...new Set(allData.map(d=>d.uf))].sort().forEach(u=>{const o=document.createElement('option');o.value=u;o.textContent=u;sel.appendChild(o)});
  sel.value=cur;
}

function applyFilters(){
  const uf=document.getElementById('f-uf').value;
  const q=document.getElementById('f-search').value.toLowerCase();
  filtered=allData.filter(d=>(!uf||d.uf===uf)&&(!activeNivel||d.nivel===activeNivel)&&(!q||d.inst.toLowerCase().includes(q)));
  selectedIdx=-1;updateStats();renderThermo();renderList();renderMarkers();renderLegend();
}

function setView(v){
  currentView=v;
  document.getElementById('tab-all').classList.toggle('active',v==='all');
  document.getElementById('tab-heat').classList.toggle('active',v==='heat');
  renderMarkers();renderLegend();
}

const STATE_COORDS={AC:[-9.02,-70.81],AL:[-9.57,-36.78],AM:[-3.47,-65.10],AP:[1.41,-51.77],BA:[-12.96,-41.75],CE:[-5.50,-39.32],DF:[-15.78,-47.93],ES:[-19.19,-40.34],GO:[-15.83,-49.62],MA:[-5.00,-44.95],MG:[-18.51,-44.56],MS:[-20.51,-54.93],MT:[-12.64,-55.42],PA:[-3.41,-52.29],PB:[-7.28,-36.57],PE:[-8.38,-37.85],PI:[-7.72,-43.00],PR:[-24.89,-51.55],RJ:[-22.25,-42.66],RN:[-5.81,-36.59],RO:[-10.83,-63.34],RR:[1.99,-61.33],RS:[-29.70,-53.27],SC:[-27.45,-50.94],SE:[-10.57,-37.40],SP:[-22.27,-48.74],TO:[-10.25,-48.25]};

function cleanNivel(v){
  if(!v) return 'Sem dados';const s=String(v);
  if(/excelente/i.test(s)) return 'Excelente';
  if(/muito bom/i.test(s)) return 'Muito Bom';
  if(/bom/i.test(s)&&!/muito/i.test(s)) return 'Bom';
  if(/regular/i.test(s)) return 'Regular';
  if(/muito baixo/i.test(s)) return 'Muito Baixo';
  if(/baixo/i.test(s)&&!/muito/i.test(s)) return 'Baixo';
  if(/cr[ií]tico/i.test(s)) return 'Crítico';
  if(/sem cadastro/i.test(s)) return 'Sem Cadastros';
  return 'Sem dados';
}

function handleFile(e){
  const file=e.target.files[0];if(!file) return;
  const ext=file.name.split('.').pop().toLowerCase();
  if(ext==='csv'){Papa.parse(file,{header:true,skipEmptyLines:true,complete(res){loadData(res.data)}});}
  else{const r=new FileReader();r.onload=ev=>{const wb=XLSX.read(ev.target.result,{type:'array'});loadData(XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]]))};r.readAsArrayBuffer(file)}
  e.target.value='';
}

function parseBR(v){
  if(v===undefined||v===null||v==='') return 0;
  let s=String(v).trim().replace(/%/g,'').trim();
  s=s.replace(/\./g,'').replace(',','.');
  return parseInt(parseFloat(s))||0;
}
function parseBRf(v){
  if(v===undefined||v===null||v==='') return 0;
  let s=String(v).trim().replace(/%/g,'').trim();
  s=s.replace(/\./g,'').replace(',','.');
  return Math.round(parseFloat(s)*10)/10||0;
}

function loadData(rows){
  let rs=42;const rnd=()=>{rs=(rs*1664525+1013904223)&0xffffffff;return(rs>>>0)/0xffffffff*5-2.5};
  const find=(obj,terms)=>{const k=Object.keys(obj).find(k=>terms.some(t=>k.toLowerCase().includes(t.toLowerCase())));return k?obj[k]:''};
  
  // Calcular totais globais da planilha importada (linha TOTAL GERAL se existir)
  const totalRow=rows.find(r=>String(find(r,['institu','nome','cliente'])||'').toUpperCase().includes('TOTAL'));
  
  const dataRows=rows.filter(r=>!String(find(r,['institu','nome','cliente'])||'').toUpperCase().match(/TOTAL|NÃO UTILIZAR|NAO UTILIZAR/));
  
  allData=dataRows.map(r=>{
    const uf=String(find(r,['uf','estado'])||'').trim().toUpperCase().slice(0,2);
    const coords=STATE_COORDS[uf]||[-15.78,-47.93];
    return{inst:String(find(r,['institu','nome','cliente'])||''),cidade:String(find(r,['cidade','city'])||''),uf,cpfs:parseBR(find(r,['cpf'])),cads:parseBR(find(r,['cadastro','cad'])),users:parseBR(find(r,['usu','user'])),pct:parseBRf(find(r,['%','engaj'])),nivel:cleanNivel(find(r,['nivel','n\u00edvel','level'])),lat:coords[0]+rnd(),lng:coords[1]+rnd()};
  }).filter(d=>d.inst&&d.uf);
  
  // Atualizar métricas globais
  if(totalRow){
    document.getElementById('m-cpfs').textContent=parseBR(find(totalRow,['cpf'])).toLocaleString('pt-BR');
    document.getElementById('m-cads').textContent=parseBR(find(totalRow,['cadastro','cad'])).toLocaleString('pt-BR');
    document.getElementById('m-users').textContent=parseBR(find(totalRow,['usu','user'])).toLocaleString('pt-BR');
  } else {
    document.getElementById('m-cpfs').textContent=allData.reduce((a,d)=>a+d.cpfs,0).toLocaleString('pt-BR');
    document.getElementById('m-cads').textContent=allData.reduce((a,d)=>a+d.cads,0).toLocaleString('pt-BR');
    document.getElementById('m-users').textContent=allData.reduce((a,d)=>a+d.users,0).toLocaleString('pt-BR');
  }
  
  filtered=[...allData];activeNivel=null;
  populateUF();applyFilters();
}

populateUF();
updateStats();renderThermo();renderList();renderMarkers();renderLegend();
</script>
